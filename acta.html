<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acta de Grado — UNIMINUTO Virtual</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --navy:    #0f1f4b;
    --navy2:   #0a1535;
    --yellow:  #f5c518;
    --gold2:   #b8860b;
    --bg:      #f4f6fb;
    --white:   #ffffff;
    --muted:   #7a8aad;
    --text:    #111b36;
    --border:  rgba(15,31,75,0.10);
    --border2: rgba(15,31,75,0.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .banner { line-height: 0; }
  .banner img { width: 100%; display: block; }

  .breadcrumb {
    background: var(--navy2);
    padding: 0.55rem 2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.45);
  }
  .breadcrumb a {
    color: rgba(255,255,255,0.45);
    text-decoration: none;
    transition: color 0.2s;
  }
  .breadcrumb a:hover { color: var(--yellow); }
  .breadcrumb span { color: var(--yellow); }
  .breadcrumb-sep { opacity: 0.3; }

  .wrap {
    max-width: 900px;
    margin: 2.2rem auto;
    padding: 0 1.5rem;
    flex: 1;
    width: 100%;
  }

  .viewer-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 1px 3px rgba(15,31,75,0.06),
      0 8px 32px rgba(15,31,75,0.08);
  }

  .viewer-header {
    padding: 1.1rem 1.6rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    background: var(--white);
  }

  .viewer-title-wrap {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .viewer-icon {
    width: 36px; height: 36px;
    border-radius: 9px;
    background: rgba(15,31,75,0.06);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .viewer-icon svg { width: 18px; height: 18px; color: var(--navy); }

  .viewer-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--navy);
  }
  .viewer-subtitle {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 400;
    margin-top: 1px;
  }

  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    background: var(--yellow);
    color: var(--navy2);
    font-weight: 700;
    border: none;
    padding: 0.55rem 1rem;
    border-radius: 9px;
    cursor: pointer;
    font-size: 0.72rem;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.15s, transform 0.15s;
  }
  .btn-back:hover { background: #e6b800; transform: translateY(-1px); }
  .btn-back svg { width: 14px; height: 14px; }

  .viewer-accent { height: 3px; background: var(--yellow); }

  .pdf-frame {
    width: 100%;
    height: 82vh;
    border: none;
    display: block;
  }

  footer {
    background: var(--navy2);
    color: rgba(255,255,255,0.35);
    text-align: center;
    padding: 1.2rem;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    margin-top: 2.5rem;
  }
  footer strong { color: var(--yellow); font-weight: 600; }
</style>
</head>
<body>

<header class="banner">
  <img src="banner.jpg" alt="UNIMINUTO">
</header>

<nav class="breadcrumb">
  <a href="index.html">Portal de Egresados</a>
  <span class="breadcrumb-sep">›</span>
  <span>Acta de Grado</span>
</nav>

<div class="wrap">
  <div class="viewer-card">
    <div class="viewer-accent"></div>
    <div class="viewer-header">
      <div class="viewer-title-wrap">
        <div class="viewer-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 12l2 2 4-4"/>
            <rect x="3" y="3" width="18" height="18" rx="3"/>
          </svg>
        </div>
        <div>
          <div class="viewer-title">Acta Individual de Grado No. 1328</div>
          <div class="viewer-subtitle">Freddy Enrique Pacheco Zambrano · CC 1.129.514.067</div>
        </div>
      </div>

      <a class="btn-back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Volver
      </a>
    </div>

    <iframe class="pdf-frame" src="acta.pdf#toolbar=0&navpanes=0&scrollbar=0" title="Acta de Grado UNIMINUTO"></iframe>
  </div>
</div>

<footer>
  © 2026 <strong>UNIMINUTO</strong> — Corporación Universitaria Minuto de Dios · Portal de Egresados
</footer>

<script>
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey && ["s","p","u"].includes(e.key)) ||
        (e.ctrlKey && e.shiftKey && ["i","j"].includes(e.key)) ||
        e.key === "F12") e.preventDefault();
  });
</script>
</body>
</html>
