<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Egresados — UNIMINUTO Virtual</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --navy:    #0f1f4b;
    --navy2:   #0a1535;
    --navy3:   #162045;
    --yellow:  #f5c518;
    --gold:    #d4a017;
    --gold2:   #b8860b;
    --bg:      #f4f6fb;
    --white:   #ffffff;
    --muted:   #7a8aad;
    --text:    #111b36;
    --border:  rgba(15,31,75,0.10);
    --border2: rgba(15,31,75,0.18);
    --glass:   rgba(255,255,255,0.72);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── BANNER ─── */
  .banner {
    position: relative;
    width: 100%;
    overflow: hidden;
    line-height: 0;
  }
  .banner img { width: 100%; height: auto; display: block; }
  .banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 55%, rgba(10,21,53,0.25) 100%);
    pointer-events: none;
  }

  /* ─── NAV BREADCRUMB ─── */
  .breadcrumb {
    background: var(--navy2);
    padding: 0.55rem 2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.45);
  }
  .breadcrumb span { color: var(--yellow); }
  .breadcrumb-sep { opacity: 0.3; }

  /* ─── LAYOUT ─── */
  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  /* ─── SECTION HEADER ─── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 2.8rem 0 2rem;
  }
  .sh-line {
    flex: 1;
    height: 1px;
    background: var(--border2);
  }
  .sh-label {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sh-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--yellow);
  }

  /* ─── GRADUATE CARD ─── */
  .grad-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 1px 3px rgba(15,31,75,0.06),
      0 8px 32px rgba(15,31,75,0.08);
    transition: box-shadow 0.3s;
  }
  .grad-card:hover {
    box-shadow:
      0 1px 3px rgba(15,31,75,0.08),
      0 16px 48px rgba(15,31,75,0.13);
  }

  .card-accent { height: 4px; background: var(--yellow); }

  .card-body {
    padding: 1.6rem 1.8rem;
    display: flex;
    align-items: center;
    gap: 1.4rem;
  }

  /* Avatar */
  .avatar {
    width: 58px; height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--navy) 0%, #2a3f8a 100%);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--yellow);
    letter-spacing: 0.02em;
    box-shadow: 0 4px 14px rgba(15,31,75,0.2);
  }

  .card-info { flex: 1; min-width: 0; }

  .card-label {
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  .card-name-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-align: left;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--navy);
    transition: color 0.2s;
    line-height: 1.2;
  }
  .card-name-btn:hover { color: var(--gold2); }

  .toggle-icon {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .toggle-icon svg {
    width: 11px; height: 11px;
    color: var(--navy2);
    transition: transform 0.3s;
  }
  .toggle-icon.open { transform: rotate(90deg); }

  .card-id {
    margin-top: 0.3rem;
    font-size: 0.76rem;
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 0.03em;
  }
  .card-id strong { color: var(--navy); font-weight: 600; }

  /* Badge */
  .badge {
    flex-shrink: 0;
    background: var(--navy);
    color: var(--white);
    border-radius: 12px;
    padding: 0.65rem 1rem;
    text-align: center;
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1;
  }
  .badge-num {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--yellow);
    line-height: 1;
    margin-bottom: 4px;
  }

  /* ─── DOCS SECTION ─── */
  .docs-wrap {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .docs-wrap.open { max-height: 600px; }

  .docs-inner {
    padding: 0.5rem 0 3rem;
  }

  .docs-eyebrow {
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
    padding-top: 0.2rem;
  }

  .docs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 1rem;
  }

  .doc-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.4rem 1.4rem 1.1rem;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s, border-color 0.22s;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(16px);
  }
  .doc-card.appear {
    animation: cardIn 0.4s cubic-bezier(.34,1.56,.64,1) both;
  }
  .doc-card:nth-child(2) { animation-delay: 0.08s; }

  .doc-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 36px rgba(15,31,75,0.13);
    border-color: var(--border2);
  }

  .doc-card-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--yellow);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s;
    border-radius: 3px 3px 0 0;
  }
  .doc-card:hover .doc-card-bar { transform: scaleX(1); }

  .doc-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: rgba(15,31,75,0.06);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1rem;
  }
  .doc-icon svg { width: 20px; height: 20px; color: var(--navy); }

  .doc-title {
    font-family: 'Playfair Display', serif;
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 0.35rem;
    line-height: 1.2;
  }

  .doc-desc {
    font-size: 0.76rem;
    color: var(--muted);
    line-height: 1.55;
    flex: 1;
  }

  .doc-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 1rem;
    margin-top: 0.8rem;
    border-top: 1px solid var(--border);
  }

  .doc-year {
    font-size: 0.68rem;
    color: var(--muted);
    font-weight: 500;
  }

  .doc-btn {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--navy2);
    background: var(--yellow);
    padding: 0.28rem 0.7rem;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .doc-card:hover .doc-btn { background: var(--gold); }

  /* ─── FOOTER ─── */
  footer {
    background: var(--navy2);
    color: rgba(255,255,255,0.35);
    text-align: center;
    padding: 1.4rem;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    margin-top: auto;
  }
  footer strong { color: var(--yellow); font-weight: 600; }

  /* ─── ANIMATIONS ─── */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 540px) {
    .badge { display: none; }
    .card-body { gap: 1rem; padding: 1.2rem 1.3rem; }
    .docs-grid { grid-template-columns: 1fr; }
    .card-name-btn { font-size: 1rem; }
  }
</style>
</head>
<body>

<header class="banner">
  <img src="banner.jpg" alt="UNIMINUTO — Portal de Egresados">
</header>

<nav class="breadcrumb">
  <span>Portal de Egresados</span>
  <span class="breadcrumb-sep">›</span>
  <span>Inicio</span>
</nav>

<main class="wrap">

  <div class="section-header">
    <div class="sh-line"></div>
    <div class="sh-label">
      <div class="sh-dot"></div>
      Egresados
    </div>
    <div class="sh-line"></div>
  </div>

  <div class="grad-card">
    <div class="card-accent"></div>
    <div class="card-body">
      <div class="avatar">FP</div>

      <div class="card-info">
        <div class="card-label">Egresado</div>
        <button class="card-name-btn" id="toggleBtn" onclick="toggleDocs()" aria-expanded="false">
          Freddy Pacheco
          <span class="toggle-icon" id="toggleIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </span>
        </button>
        <div class="card-id">CC: <strong>1.129.514.067</strong></div>
      </div>

      <div class="badge">
        <span class="badge-num" id="badgeNum">2</span>
        Documentos
      </div>
    </div>
  </div>

  <div class="docs-wrap" id="docsWrap" aria-hidden="true">
    <div class="docs-inner">
      <div class="docs-eyebrow">Documentos disponibles</div>
      <div class="docs-grid" id="docsGrid"></div>
    </div>
  </div>

</main>

<footer>
  © 2026 <strong>UNIMINUTO</strong> — Corporación Universitaria Minuto de Dios · Portal de Egresados
</footer>

<script>
  history.pushState(null, "", location.href);
  window.addEventListener("popstate", () => {
    window.location.href = "https://www.uniminuto.edu/";
  });

  const DOCS = [
    {
      title: "Diploma",
      description: "Diploma oficial de grado en Ingeniería de Sistemas.",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M8 8h8M8 16h5"/></svg>`,
      year: "2025",
      page: "diploma.html"
    },
    {
      title: "Acta de Grado",
      description: "Acta individual de grado No. 1328. Certificación oficial de titulación.",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 12l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>`,
      year: "2025",
      page: "acta.html"
    }
  ];

  function renderDocs() {
    const grid = document.getElementById("docsGrid");
    grid.innerHTML = DOCS.map((d, i) => `
      <div class="doc-card" onclick="go('${d.page}')" tabindex="0" onkeydown="if(event.key==='Enter')go('${d.page}')">
        <div class="doc-card-bar"></div>
        <div class="doc-icon">${d.icon}</div>
        <div class="doc-title">${d.title}</div>
        <div class="doc-desc">${d.description}</div>
        <div class="doc-footer">
          <span class="doc-year">${d.year}</span>
          <span class="doc-btn">Ver documento</span>
        </div>
      </div>
    `).join("");
    requestAnimationFrame(() => {
      grid.querySelectorAll(".doc-card").forEach((c, i) => {
        setTimeout(() => c.classList.add("appear"), i * 80);
      });
    });
  }

  function go(page) { window.location.href = page; }

  let open = false;

  function toggleDocs() {
    open = !open;
    const wrap = document.getElementById("docsWrap");
    const icon = document.getElementById("toggleIcon");
    const btn  = document.getElementById("toggleBtn");

    if (open) {
      wrap.classList.add("open");
      wrap.setAttribute("aria-hidden", "false");
      icon.classList.add("open");
      btn.setAttribute("aria-expanded", "true");
      renderDocs();
      setTimeout(() => wrap.scrollIntoView({ behavior: "smooth", block: "nearest" }), 100);
    } else {
      wrap.classList.remove("open");
      wrap.setAttribute("aria-hidden", "true");
      icon.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
    }
  }

  document.getElementById("badgeNum").textContent = DOCS.length;

  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey && ["s","p","u"].includes(e.key)) ||
        (e.ctrlKey && e.shiftKey && ["i","j"].includes(e.key)) ||
        e.key === "F12") e.preventDefault();
  });
</script>
</body>
</html>
