<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Egresados — UNIMINUTO Virtual</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --navy:    #1b2c6b;
    --navy2:   #152255;
    --navy3:   #0f1a40;
    --yellow:  #f5c400;
    --yellow2: #e0b200;
    --bg:      #f2f4f8;
    --white:   #ffffff;
    --muted:   #6b7a9e;
    --text:    #12213f;
    --border:  rgba(27,44,107,0.11);
    --border2: rgba(27,44,107,0.20);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* BANNER */
  .banner { line-height: 0; display: block; }
  .banner img { width: 100%; height: auto; display: block; }

  /* TOPBAR */
  .topbar {
    background: var(--navy3);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.71rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.40);
    height: 36px;
  }
  .topbar-sep { opacity: 0.25; margin: 0 2px; }
  .topbar-active { color: var(--yellow); }

  /* LAYOUT */
  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 1.5rem;
    flex: 1;
    width: 100%;
  }

  /* SECTION HEADER */
  .section-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 2.8rem 0 2rem;
  }
  .sh-line { flex: 1; height: 2px; background: var(--yellow); border-radius: 2px; }
  .sh-label {
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--navy);
    white-space: nowrap;
  }

  /* GRADUATE CARD */
  .grad-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(27,44,107,0.09);
    transition: box-shadow 0.3s;
  }

  .card-accent { height: 5px; background: var(--yellow); }

  .card-body {
    padding: 1.5rem 1.8rem;
    display: flex;
    align-items: center;
    gap: 1.4rem;
  }

  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--yellow);
    letter-spacing: 0.04em;
  }

  .card-info { flex: 1; min-width: 0; }

  .card-label {
    font-size: 0.60rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  .card-name-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-align: left;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-family: 'Montserrat', sans-serif;
    font-size: 1.08rem;
    font-weight: 800;
    color: var(--navy);
    transition: color 0.2s;
    line-height: 1.2;
  }
  .card-name-btn:hover { color: var(--yellow2); }

  .toggle-icon {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .toggle-icon svg { width: 10px; height: 10px; color: var(--navy3); }
  .toggle-icon.open { transform: rotate(90deg); }

  .card-id {
    margin-top: 0.28rem;
    font-size: 0.74rem;
    color: var(--muted);
    font-weight: 500;
  }
  .card-id strong { color: var(--navy); font-weight: 700; }

  .badge {
    flex-shrink: 0;
    background: var(--navy);
    color: var(--white);
    border-radius: 10px;
    padding: 0.7rem 1.1rem;
    text-align: center;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    line-height: 1;
  }
  .badge-num {
    display: block;
    font-size: 1.7rem;
    font-weight: 900;
    color: var(--yellow);
    line-height: 1;
    margin-bottom: 4px;
  }

  /* DOCS */
  .docs-wrap {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .docs-wrap.open { max-height: 700px; }

  .docs-inner { padding: 0.4rem 0 3.5rem; }

  .docs-eyebrow {
    font-size: 0.60rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
    padding-top: 0.4rem;
  }

  .docs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 1rem;
  }

  .doc-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 1.3rem 1.3rem 1rem;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s, border-color 0.22s;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(14px);
  }
  .doc-card.appear { animation: cardIn 0.38s cubic-bezier(.34,1.56,.64,1) both; }
  .doc-card:nth-child(2).appear { animation-delay: 0.09s; }

  .doc-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(27,44,107,0.14);
    border-color: var(--yellow);
  }

  .doc-icon {
    width: 38px; height: 38px;
    border-radius: 8px;
    background: rgba(27,44,107,0.07);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 0.9rem;
  }
  .doc-icon svg { width: 18px; height: 18px; color: var(--navy); }

  .doc-title {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--navy);
    margin-bottom: 0.3rem;
    line-height: 1.2;
  }
  .doc-desc {
    font-size: 0.74rem;
    color: var(--muted);
    line-height: 1.55;
    flex: 1;
    font-weight: 500;
  }
  .doc-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 0.9rem;
    margin-top: 0.8rem;
    border-top: 1px solid var(--border);
  }
  .doc-year { font-size: 0.66rem; color: var(--muted); font-weight: 600; }
  .doc-btn {
    font-size: 0.63rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--navy3);
    background: var(--yellow);
    padding: 0.28rem 0.7rem;
    border-radius: 5px;
    transition: background 0.15s;
  }
  .doc-card:hover .doc-btn { background: var(--yellow2); }

  /* FOOTER */
  footer {
    background: var(--navy3);
    color: rgba(255,255,255,0.32);
    text-align: center;
    padding: 1.3rem;
    font-size: 0.68rem;
    letter-spacing: 0.07em;
    font-weight: 500;
    margin-top: auto;
  }
  footer strong { color: var(--yellow); font-weight: 700; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 540px) {
    .badge { display: none; }
    .docs-grid { grid-template-columns: 1fr; }
    .card-name-btn { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<header class="banner">
  <img src="banner.jpg" alt="UNIMINUTO — Portal de Egresados">
</header>

<nav class="topbar">
  <span>Portal de Egresados</span>
  <span class="topbar-sep">›</span>
  <span class="topbar-active">Inicio</span>
</nav>

<main class="wrap">
  <div class="section-header">
    <div class="sh-line"></div>
    <div class="sh-label">Egresados</div>
    <div class="sh-line"></div>
  </div>

  <div class="grad-card">
    <div class="card-accent"></div>
    <div class="card-body">
      <div class="avatar">FP</div>

      <div class="card-info">
        <div class="card-label">Egresado</div>
        <button class="card-name-btn" id="toggleBtn" onclick="toggleDocs()" aria-expanded="false">
          Freddy Pacheco
          <span class="toggle-icon" id="toggleIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </span>
        </button>
        <div class="card-id">CC: <strong>1.129.514.067</strong></div>
      </div>

      <div class="badge">
        <span class="badge-num" id="badgeNum">2</span>
        Documentos
      </div>
    </div>
  </div>

  <div class="docs-wrap" id="docsWrap" aria-hidden="true">
    <div class="docs-inner">
      <div class="docs-eyebrow">Documentos disponibles</div>
      <div class="docs-grid" id="docsGrid"></div>
    </div>
  </div>
</main>

<footer>
  © 2026 <strong>UNIMINUTO</strong> — Corporación Universitaria Minuto de Dios · Portal de Egresados
</footer>

<script>
  history.pushState(null, "", location.href);
  window.addEventListener("popstate", () => { window.location.href = "https://www.uniminuto.edu/"; });

  const DOCS = [
    {
      title: "Diploma",
      description: "Diploma oficial de grado en Ingeniería de Sistemas.",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M8 8h8M8 16h5"/></svg>`,
      year: "2025", page: "diploma.html"
    },
    {
      title: "Acta de Grado",
      description: "Acta individual No. 1328. Certificación oficial de titulación.",
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 12l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>`,
      year: "2025", page: "acta.html"
    }
  ];

  function renderDocs() {
    const grid = document.getElementById("docsGrid");
    grid.innerHTML = DOCS.map(d => `
      <div class="doc-card" onclick="window.location.href='${d.page}'" tabindex="0" onkeydown="if(event.key==='Enter')window.location.href='${d.page}'">
        <div class="doc-icon">${d.icon}</div>
        <div class="doc-title">${d.title}</div>
        <div class="doc-desc">${d.description}</div>
        <div class="doc-footer">
          <span class="doc-year">${d.year}</span>
          <span class="doc-btn">Ver documento</span>
        </div>
      </div>`).join("");
    requestAnimationFrame(() => {
      grid.querySelectorAll(".doc-card").forEach((c,i) => setTimeout(() => c.classList.add("appear"), i*85));
    });
  }

  let open = false;
  function toggleDocs() {
    open = !open;
    const wrap = document.getElementById("docsWrap");
    const icon = document.getElementById("toggleIcon");
    const btn  = document.getElementById("toggleBtn");
    if (open) {
      wrap.classList.add("open");
      wrap.setAttribute("aria-hidden","false");
      icon.classList.add("open");
      btn.setAttribute("aria-expanded","true");
      renderDocs();
      setTimeout(() => wrap.scrollIntoView({behavior:"smooth",block:"nearest"}), 120);
    } else {
      wrap.classList.remove("open");
      wrap.setAttribute("aria-hidden","true");
      icon.classList.remove("open");
      btn.setAttribute("aria-expanded","false");
    }
  }

  document.getElementById("badgeNum").textContent = DOCS.length;
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey && ["s","p","u"].includes(e.key)) ||
        (e.ctrlKey && e.shiftKey && ["i","j"].includes(e.key)) ||
        e.key === "F12") e.preventDefault();
  });
</script>
</body>
</html>
