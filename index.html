<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egresados — UNIMINUTO Virtual</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:   #1e2d5a;
    --navy2:  #162248;
    --yellow: #f5c518;
    --gold:   #c8922a;
    --bg:     #eef1f8;
    --white:  #ffffff;
    --muted:  #6b7a99;
    --text:   #1a2744;
    --border: rgba(30,45,90,0.13);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Open Sans', sans-serif;
    min-height: 100vh;
  }

  /* ═══════════ BANNER — imagen real ═══════════ */
  .banner {
    width: 100%;
    display: block;
    line-height: 0;
  }

  .banner img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ═══════════ EGRESADOS ═══════════ */
  .section-egresados {
    max-width: 780px;
    margin: 2.6rem auto 0;
    padding: 0 1.4rem;
  }

  .egresados-header {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    margin-bottom: 1.4rem;
  }

  .eg-line {
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, var(--yellow), transparent);
  }

  .eg-line.right {
    background: linear-gradient(270deg, var(--yellow), transparent);
  }

  .egresados-title {
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--navy);
    white-space: nowrap;
  }

  /* Tarjeta egresado */
  .egresado-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(30,45,90,0.08);
  }

  .card-stripe { height: 5px; background: var(--yellow); }

  .card-body {
    padding: 1.5rem 1.6rem;
    display: flex;
    align-items: center;
    gap: 1.2rem;
  }

  .person-icon {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .person-icon svg { width: 26px; height: 26px; color: var(--navy); }

  .card-info { flex: 1; }

  .card-label {
    font-size: 0.63rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }

  .card-name {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1rem;
    font-weight: 800;
    color: var(--navy);
    text-decoration: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }

  .card-name:hover { color: var(--gold); border-bottom-color: var(--yellow); }

  .name-arrow {
    width: 20px; height: 20px;
    background: var(--yellow);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.25s;
  }

  .name-arrow svg { width: 10px; height: 10px; color: var(--navy2); transition: transform 0.25s; }
  .name-arrow.open svg { transform: rotate(90deg); }

  .card-cc {
    margin-top: 0.3rem;
    font-size: 0.74rem;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .card-badge {
    flex-shrink: 0;
    background: var(--navy);
    color: var(--white);
    border-radius: 8px;
    padding: 0.5rem 0.85rem;
    text-align: center;
    font-size: 0.64rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .badge-num {
    display: block;
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--yellow);
    line-height: 1;
    margin-bottom: 2px;
  }

  /* ═══════════ DOCUMENTOS ═══════════ */
  .docs-section {
    max-width: 780px;
    margin: 1.8rem auto 4rem;
    padding: 0 1.4rem;
    display: none;
    animation: fadeUp 0.4s ease both;
  }

  .docs-section.visible { display: block; }

  .docs-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-bottom: 0.6rem;
  }

  .docs-owner {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .docs-title {
    font-size: 1rem;
    font-weight: 800;
    color: var(--navy);
    margin-top: 0.1rem;
  }

  .docs-search-wrap {
    position: relative;
    width: 210px;
  }

  .docs-search-wrap svg {
    position: absolute;
    left: 0.75rem; top: 50%;
    transform: translateY(-50%);
    width: 13px; height: 13px;
    color: var(--muted);
  }

  .docs-search {
    width: 100%;
    padding: 0.52rem 1rem 0.52rem 2rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Open Sans', sans-serif;
    font-size: 0.82rem;
    color: var(--text);
    background: var(--white);
    outline: none;
    transition: border-color 0.2s;
  }

  .docs-search::placeholder { color: var(--muted); }
  .docs-search:focus { border-color: var(--navy); }

  .docs-divider {
    height: 2px;
    background: linear-gradient(90deg, var(--yellow), rgba(30,45,90,0.08));
    border-radius: 2px;
    margin: 0.8rem 0 1.1rem;
  }

  /* Grid */
  .docs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 1rem;
  }

  /* Doc card */
  .doc-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  .doc-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--yellow);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s;
  }

  .doc-card:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(30,45,90,0.12); border-color: rgba(30,45,90,0.22); }
  .doc-card:hover::after { transform: scaleX(1); }

  .doc-top { display: flex; align-items: flex-start; gap: 0.8rem; }
  .doc-icon { width: 40px; height: 48px; flex-shrink: 0; }
  .doc-icon svg { width: 100%; height: 100%; }
  .doc-meta { flex: 1; }

  .doc-type-tag {
    display: inline-block;
    font-size: 0.56rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    padding: 0.13rem 0.42rem;
    border-radius: 3px;
    margin-bottom: 0.28rem;
  }

  .tag-pdf   { background: #fff0ed; color: #c8401a; }
  .tag-word  { background: #edf2fb; color: #2b579a; }
  .tag-excel { background: #edf7f1; color: #217346; }
  .tag-ppt   { background: #fff3ee; color: #d24726; }
  .tag-img   { background: #f0ebff; color: #7b5ea7; }
  .tag-other { background: #fdf8e8; color: #8a6200; }

  .doc-title {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.25;
  }

  .doc-desc {
    font-size: 0.76rem;
    color: var(--muted);
    line-height: 1.5;
  }

  .doc-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 0.65rem;
    border-top: 1px solid var(--border);
    margin-top: auto;
  }

  .doc-date { font-size: 0.68rem; color: var(--muted); font-weight: 600; }

  .doc-cta {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--navy2);
    background: var(--yellow);
    padding: 0.24rem 0.6rem;
    border-radius: 5px;
    transition: background 0.18s;
  }

  .doc-card:hover .doc-cta { background: #d4a800; }
  .doc-cta svg { width: 9px; height: 9px; }

  .docs-empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 3rem;
    color: var(--muted);
  }

  /* ═══════════ FOOTER ═══════════ */
  footer {
    background: var(--navy2);
    color: rgba(255,255,255,0.4);
    text-align: center;
    padding: 1.2rem;
    font-size: 0.7rem;
    letter-spacing: 0.04em;
  }
  footer strong { color: var(--yellow); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .card-badge { display: none; }
    .docs-search-wrap { width: 100%; }
    .docs-top { flex-direction: column; align-items: flex-start; }
    .docs-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

// ══════════════════════════════════════════════════════════
// DOCUMENTOS — archivos locales en la carpeta "documentos/"

const DOCS = [

    title: "Diploma de Grado",
    description: "Diploma original de grado expedido por UNIMINUTO Virtual.",
    type: "pdf",
    date: "2025",
    file: "documentos/diploma-de-grado.pdf"
  },
  {
    title: "Acta de Grado",
    description: "Acta oficial del proceso de graduación.",
    type: "pdf",
    date: "2025",
    file: "documentos/acta-de-grado.pdf"
  },
];

// ══════════════════════════════════════════════════════════

const ICONS = {
  pdf: `<svg viewBox="0 0 42 50" fill="none"><rect width="42" height="50" rx="5" fill="#fff0ed"/><path d="M5 4h18l13 12v26a4 4 0 01-4 4H5a4 4 0 01-4-4V8a4 4 0 014-4z" fill="#ffd5cc"/><path d="M23 4l13 12H23V4z" fill="#c8401a" opacity="0.6"/><text x="21" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="900" fill="#c8401a">PDF</text></svg>`,
  word:`<svg viewBox="0 0 42 50" fill="none"><rect width="42" height="50" rx="5" fill="#edf2fb"/><path d="M5 4h18l13 12v26a4 4 0 01-4 4H5a4 4 0 01-4-4V8a4 4 0 014-4z" fill="#d2e3f7"/><path d="M23 4l13 12H23V4z" fill="#2b579a" opacity="0.6"/><text x="21" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="900" fill="#2b579a">DOC</text></svg>`,
  excel:`<svg viewBox="0 0 42 50" fill="none"><rect width="42" height="50" rx="5" fill="#edf7f1"/><path d="M5 4h18l13 12v26a4 4 0 01-4 4H5a4 4 0 01-4-4V8a4 4 0 014-4z" fill="#ccebd5"/><path d="M23 4l13 12H23V4z" fill="#217346" opacity="0.6"/><text x="21" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="900" fill="#217346">XLS</text></svg>`,
  ppt:  `<svg viewBox="0 0 42 50" fill="none"><rect width="42" height="50" rx="5" fill="#fff3ee"/><path d="M5 4h18l13 12v26a4 4 0 01-4 4H5a4 4 0 01-4-4V8a4 4 0 014-4z" fill="#fdddd0"/><path d="M23 4l13 12H23V4z" fill="#d24726" opacity="0.6"/><text x="21" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="900" fill="#d24726">PPT</text></svg>`,
  img:  `<svg viewBox="0 0 42 50" fill="none"><rect width="42" height="50" rx="5" fill="#f0ebff"/><path d="M5 4h18l13 12v26a4 4 0 01-4 4H5a4 4 0 01-4-4V8a4 4 0 014-4z" fill="#ddd0ff"/><path d="M23 4l13 12H23V4z" fill="#7b5ea7" opacity="0.6"/><text x="21" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="900" fill="#7b5ea7">IMG</text></svg>`,
  other:`<svg viewBox="0 0 42 50" fill="none"><rect width="42" height="50" rx="5" fill="#fdf8e8"/><path d="M5 4h18l13 12v26a4 4 0 01-4 4H5a4 4 0 01-4-4V8a4 4 0 014-4z" fill="#f8edba"/><path d="M23 4l13 12H23V4z" fill="#8a6200" opacity="0.5"/><text x="21" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="900" fill="#8a6200">DOC</text></svg>`,
};

const LABELS = {pdf:'PDF',word:'Word',excel:'Excel',ppt:'PowerPoint',img:'Imagen',other:'Archivo'};
const TAGS   = {pdf:'tag-pdf',word:'tag-word',excel:'tag-excel',ppt:'tag-ppt',img:'tag-img',other:'tag-other'};

document.getElementById('badge-num').textContent = DOCS.length;

function docCard(d) {
  const icon  = ICONS[d.type]  || ICONS.other;
  const label = LABELS[d.type] || 'Archivo';
  const tag   = TAGS[d.type]   || 'tag-other';
  return `<div class="doc-card" onclick="openDoc('${d.file}')">
    <div class="doc-top">
      <div class="doc-icon">${icon}</div>
      <div class="doc-meta">
        <span class="doc-type-tag ${tag}">${label}</span>
        <div class="doc-title">${d.title}</div>
      </div>
    </div>
    <div class="doc-desc">${d.description}</div>
    <div class="doc-footer">
      <span class="doc-date">${d.date}</span>
      <span class="doc-cta">Abrir
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
          <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </span>
    </div>
  </div>`;
}

function openDoc(filePath) {
  window.open(filePath, '_blank');
}

function renderDocs(docs) {
  const g = document.getElementById('docs-grid');
  g.innerHTML = docs.length
    ? docs.map(docCard).join('')
    : '<div class="docs-empty">🗂️<br><br>No se encontraron documentos.</div>';
  g.querySelectorAll('.doc-card').forEach((c, i) => c.style.animationDelay = (i * 0.07) + 's');
}

let docsVisible = false;

function toggleDocs(e) {
  e.preventDefault();
  const sec   = document.getElementById('docs-section');
  const arrow = document.getElementById('name-arrow');
  docsVisible = !docsVisible;
  if (docsVisible) {
    sec.classList.add('visible');
    renderDocs(DOCS);
    arrow.classList.add('open');
    setTimeout(() => sec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
  } else {
    sec.classList.remove('visible');
    arrow.classList.remove('open');
  }
}

document.getElementById('docs-search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  renderDocs(DOCS.filter(d => (d.title + d.description).toLowerCase().includes(q)));
});
</script>
